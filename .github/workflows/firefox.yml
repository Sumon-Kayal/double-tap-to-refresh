# Firefox build: test, lint, sign with Mozilla, then pack the signed XPI together with its source.
#
# Run it by hand: Actions > Firefox build > Run workflow.
#   "Use workflow from" picks the branch. Nothing else does.
#   tag empty    Development build of that branch. The archive stays on the run page as the
#                artifact "Firefox-Development" for 72 hours. No release is touched.
#   tag filled   Release build of exactly that tag. The signed XPI and the source archive are
#                added to the GitHub Release that already exists for the tag.
#
# Needs two repository secrets, WEB_EXT_API_KEY and WEB_EXT_API_SECRET (the JWT issuer and JWT
# secret from https://addons.mozilla.org/developers/addon/api/key/). Only the isolated signing
# job can read them. Mozilla signs each version number only once, so raise "version" in
# manifests/firefox.json (and chromium.json) for changed contents, development builds included.
# Identical retries reuse the submission.
name: Firefox build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave empty for a development build)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Test, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.source.outputs.mode }}
      sha: ${{ steps.revision.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      # The tag is typed by a person, so it only ever travels through env: and is checked before use.
      - name: Choose the source
        id: source
        env:
          TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != branch ]; then
            echo "::error::Pick a branch under 'Use workflow from'. To build a release, type its tag into the tag field."
            exit 1
          fi
          if [ -z "$TAG" ]; then
            { echo mode=development; echo "ref=$GITHUB_SHA"; echo tag=; } >> "$GITHUB_OUTPUT"
            echo "Development build of the selected branch at $GITHUB_SHA."
            exit 0
          fi
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/+-]{0,99}$ ]] || ! git check-ref-format "refs/tags/$TAG"; then
            echo "::error::That is not a valid tag name."
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::Tag $TAG has no GitHub Release. Create the release first; this workflow only adds files to it."
            exit 1
          fi
          { echo mode=release; echo "ref=refs/tags/$TAG"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"
          echo "Release build of tag $TAG."

      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Confirm the checked-out revision
        id: revision
        env:
          MODE: ${{ steps.source.outputs.mode }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$MODE" = release ]; then
            expected=$(git rev-parse "refs/tags/$TAG^{commit}")
          else
            expected=$GITHUB_SHA
          fi
          if [ "$(git rev-parse HEAD)" != "$expected" ]; then
            echo "::error::The checked-out revision is not the one that was asked for."
            exit 1
          fi
          echo "sha=$expected" >> "$GITHUB_OUTPUT"
          git log -1 --format='Building %h (%cI)'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run the tests
        run: node --test

      - name: Install web-ext
        run: npm install --global --ignore-scripts --no-audit --no-fund web-ext@10.8.0

      - name: Build the Firefox extension
        run: bash scripts/build.sh firefox

      - name: Lint it
        run: web-ext lint --source-dir firefox --warnings-as-errors --no-config-discovery

      - name: Hand over built extension to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Firefox-Unsigned-Dir
          path: firefox/
          retention-days: 1
          if-no-files-found: error

  sign:
    name: Sign and pack
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Confirm the checked-out revision
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::The signing checkout differs from the built revision."
            exit 1
          fi

      - name: Download the built extension directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Firefox-Unsigned-Dir
          path: firefox

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install web-ext
        run: npm install --global --ignore-scripts --no-audit --no-fund web-ext@10.8.0

      - name: Sign with Mozilla (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::Add the repository secrets WEB_EXT_API_KEY and WEB_EXT_API_SECRET first."
            exit 1
          fi
          mkdir -p dist
          if python3 scripts/resume-firefox-signing.py; then
            echo "Reused the matching Mozilla submission."
          else
            status=$?
            [ "$status" -eq 3 ] || exit "$status"
            web-ext sign --source-dir firefox --artifacts-dir web-ext-artifacts \
              --channel unlisted --approval-timeout 900000 --no-config-discovery
            cp web-ext-artifacts/*.xpi dist/firefox-signed.xpi
          fi

      - name: Pack the signed XPI with its source
        id: archive
        env:
          MODE: ${{ needs.build.outputs.mode }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive=$(bash scripts/make-archive.sh firefox "$MODE" "$BRANCH" dist/firefox-signed.xpi)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          {
            echo "### Firefox ${MODE} build"
            echo
            echo '```'
            sha256sum "$archive" dist/firefox-signed.xpi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the development archive (kept for 72 hours)
        if: needs.build.outputs.mode == 'development'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Firefox-Development
          path: ${{ steps.archive.outputs.archive }}
          retention-days: 3
          if-no-files-found: error

      # Not a release asset: a one-day hand-over, so the publish job (the only one allowed to
      # write to the repository) never runs the build, and can be re-run if the upload fails.
      - name: Pass the release files to the publish job
        if: needs.build.outputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Firefox-Release-Files
          path: |
            ${{ steps.archive.outputs.archive }}
            dist/firefox-signed.xpi
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Add to the GitHub Release
    needs:
      - build
      - sign
    if: needs.build.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Firefox-Release-Files
          path: release

      # Only adds files to the release that already exists for the tag. It never creates one.
      - name: Upload them to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/* --repo "$REPO" --clobber
          echo "Added the signed XPI and the source archive to release $TAG." >> "$GITHUB_STEP_SUMMARY"
