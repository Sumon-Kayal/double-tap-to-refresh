# Quick test release: builds both extensions from the branch you pick, with no signing and no secrets.
#
# Run it by hand: Actions > Test release > Run workflow ("Use workflow from" picks the branch).
#
# scripts/build.sh creates the chromium/ and firefox/ folders, puts the extension's files in each
# (src/ plus that browser's manifest) together with the license saved as LICENSE.txt, and zips
# them. The run then packs one download, test-release-bundle.tar.gz, kept for 3 days: the Chromium
# zip, the unsigned Firefox xpi and two source archives (source-chrome.tar.gz and
# source-firefox.tar.gz). Each source archive comes from `git archive`, so it holds exactly the
# committed files of the revision: no build output, no untracked files.
#
# The Firefox file is not signed, so Firefox for Android Release and Beta will refuse it (see
# README.md). The "Firefox build" workflow makes a signed one. The folders are generated and
# listed in .gitignore, so they never reach the repository.
name: Test release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build both extensions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run the tests
        run: node --test

      - name: Build extensions and bundle tarball
        id: build
        run: |
          set -euo pipefail
          bash scripts/build.sh

          chromium=$(ls dist/double-tap-to-refresh-chromium-*.zip)
          firefox=$(ls dist/double-tap-to-refresh-firefox-*.xpi)

          # Two source archives of exactly the committed files (a tar of the working tree would
          # also pick up the chromium/ and firefox/ folders that were just built).
          src_chrome="dist/source-chrome.tar.gz"
          src_firefox="dist/source-firefox.tar.gz"
          git archive --format=tar.gz --output "$src_chrome" HEAD
          git archive --format=tar.gz --output "$src_firefox" HEAD

          bundle="dist/test-release-bundle.tar.gz"
          tar -czf "$bundle" -C dist \
            "$(basename "$chromium")" \
            "$(basename "$src_chrome")" \
            "$(basename "$firefox")" \
            "$(basename "$src_firefox")"

          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          {
            echo '### Test release'
            echo
            echo '```'
            sha256sum "$chromium" "$src_chrome" "$firefox" "$src_firefox" "$bundle"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # archive: false uploads the tarball itself, and the artifact is named after the file
      # (a name given here would be ignored).
      - name: Upload test release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.build.outputs.bundle }}
          archive: false
          retention-days: 3
          if-no-files-found: error
