# Chromium build: test, build the extension zip, then pack it together with its source.
#
# Run it by hand: Actions > Chromium build > Run workflow.
#   "Use workflow from" picks the branch. Nothing else does.
#   tag empty    Development build of that branch. The archive stays on the run page as the
#                artifact "Chromium-Development" for 72 hours. No release is touched.
#   tag filled   Release build of exactly that tag. The zip and the source archive are added to
#                the GitHub Release that already exists for the tag.
#
# No secrets are used: this workflow cannot sign anything, and the Chromium zip is unsigned.
# (web-ext is not installed either; scripts/build.sh already zips the folder.)
name: Chromium build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave empty for a development build)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.source.outputs.mode }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      # The tag is typed by a person, so it only ever travels through env: and is checked before use.
      - name: Choose the source
        id: source
        env:
          TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != branch ]; then
            echo "::error::Pick a branch under 'Use workflow from'. To build a release, type its tag into the tag field."
            exit 1
          fi
          if [ -z "$TAG" ]; then
            { echo mode=development; echo "ref=$GITHUB_SHA"; echo tag=; } >> "$GITHUB_OUTPUT"
            echo "Development build of the selected branch at $GITHUB_SHA."
            exit 0
          fi
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/+-]{0,99}$ ]] || ! git check-ref-format "refs/tags/$TAG"; then
            echo "::error::That is not a valid tag name."
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::Tag $TAG has no GitHub Release. Create the release first; this workflow only adds files to it."
            exit 1
          fi
          { echo mode=release; echo "ref=refs/tags/$TAG"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"
          echo "Release build of tag $TAG."

      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Confirm the checked-out revision
        env:
          MODE: ${{ steps.source.outputs.mode }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$MODE" = release ]; then
            expected=$(git rev-parse "refs/tags/$TAG^{commit}")
          else
            expected=$GITHUB_SHA
          fi
          if [ "$(git rev-parse HEAD)" != "$expected" ]; then
            echo "::error::The checked-out revision is not the one that was asked for."
            exit 1
          fi
          git log -1 --format='Building %h (%cI)'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run the tests
        run: node --test

      - name: Build the Chromium extension
        run: |
          set -euo pipefail
          bash scripts/build.sh chromium
          cp dist/double-tap-to-refresh-chromium-*.zip dist/chromium.zip

      - name: Pack the zip with its source
        id: archive
        env:
          MODE: ${{ steps.source.outputs.mode }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive=$(bash scripts/make-archive.sh chromium "$MODE" "$BRANCH" dist/chromium.zip)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          {
            echo "### Chromium ${MODE} build"
            echo
            echo '```'
            sha256sum "$archive" dist/chromium.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the development archive (kept for 72 hours)
        if: steps.source.outputs.mode == 'development'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Chromium-Development
          path: ${{ steps.archive.outputs.archive }}
          retention-days: 3
          if-no-files-found: error

      # Not a release asset: a one-day hand-over, so the publish job (the only one allowed to
      # write to the repository) never runs the build, and can be re-run if the upload fails.
      - name: Pass the release files to the publish job
        if: steps.source.outputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Chromium-Release-Files
          path: |
            ${{ steps.archive.outputs.archive }}
            dist/chromium.zip
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Add to the GitHub Release
    needs: build
    if: needs.build.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Chromium-Release-Files
          path: release

      # Only adds files to the release that already exists for the tag. It never creates one.
      - name: Upload them to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release/* --repo "$REPO" --clobber
          echo "Added the zip and the source archive to release $TAG." >> "$GITHUB_STEP_SUMMARY"
